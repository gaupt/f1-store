version: '3.9'

services:
  postgres:
    image: postgres:17-alpine3.20
    environment:
      POSTGRES_PASSWORD: "root1234"
      POSTGRES_USER: "root"
      POSTGRES_DB: "backendrds"
      PGDATA: "/var/lib/postgresql/data/pgdata"
    volumes:
      - .:/docker-entrypoint-initdb.d
      - rds-data:/var/lib/postgresql/data  
    ports: 
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d backendrds"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    labels:
      NAME: "postgres_bk"

  backend_rds:
    image: backend_rds:0.1.0
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CORS_ALLOWED_ORIGINS: "http://localhost:3000"
      DB_NAME: "backendrds"
      DB_USER: "root"
      DB_PASSWORD: "root1234"
      DB_HOST: "postgres"
      DB_PORT: "5432"
    ports:
      - "8081:8081"

  redis:
    image: redis:7.4.2-alpine
    environment:
      REDIS_PASSWORD: "root1234"
    ports:
      - "6379:6379"

  backend_redis:
    image: backend_redis:0.1.0
    depends_on:
      - redis
    environment:
      CORS_ALLOWED_ORIGINS: "http://localhost:3000"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "root1234"
    ports:
      - "8080:8080"

  frontend:
    image: frontend:0.1.0
    ports:
      - "3000:80"  # Assuming the frontend serves on port 80 inside the container

volumes:
  rds-data:

